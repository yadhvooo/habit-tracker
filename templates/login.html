{% extends "base.html" %}

{% block title %}Login - Habit Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-panel auth-panel">
        <div class="auth-header">
            <i class="ph ph-check-circle auth-icon"></i>
            <h2>Welcome Back</h2>
            <p>Sign in to track your habits</p>
        </div>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
