{% extends "base.html" %}

{% block title %}Register - Habit Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-panel auth-panel">
        <div class="auth-header">
            <i class="ph ph-sparkle auth-icon"></i>
            <h2>Create Account</h2>
            <p>Start your habit journey today</p>
        </div>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Choose a password">
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</div>
{% endblock %}
